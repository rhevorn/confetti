# Tables and scalar values
[project]
name = "confetti-demo"
version = "0.1.0"
requires-python = ">=3.12"
keywords = ["config", "formatter", "highlighting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
  ]

[project.urls]
Homepage = "https://example.test/confetti?a=b"
Issues = "https://example.test/confetti/issues"

[tool.confetti]
enabled = true
threshold = 70
released_at = 2026-08-26T12:30:00Z
hex_mask = 0xFF_A0
dotted.key = "value"
inline = { mode = "safe", retries = 3 }
description = """
Confetti keeps multiline string content intact.
The text may contain # signs and = characters.
"""

[[tool.confetti.rules]]
pattern = "*.conf"
language = "nginx"

[[tool.confetti.rules]]
pattern = ".env.*"
language = "env"
