# ~/.tmux.conf — tmux terminal multiplexer configuration
set -g   default-terminal   "screen-256color"
set -g   history-limit   50000
set -g   base-index   1
setw -g   pane-base-index   1
set -g   renumber-windows   on
set -g   mouse   on
set -g   status-interval   5

# reload configuration
bind r   source-file   ~/.tmux.conf   \;   display   "Reloaded #{T}"

# prefix
unbind   C-b
set -g   prefix   C-a
bind   C-a   send-prefix

# pane splitting with intuitive keys
bind |   split-window   -h
bind -   split-window   -v

# window navigation
bind -n   M-Left   previous-window
bind -n   M-Right   next-window
bind -n   M-1   select-window   -t   1

# status bar
set -g   status-position   top
set -g   status-left   '#[fg=green]#S '
set -g   status-right   '#[fg=cyan]#H   #{?window_zoomed_flag,ZOOM,}'

set-environment   -g   FOO   bar
if-shell   "test -f ~/.tmux.local"   "source ~/.tmux.local"
