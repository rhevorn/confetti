# setup.cfg keeps setuptools configuration out of setup.py
[metadata]
name    = confetti-demo
version    = attr: confetti_demo.__version__
description  = A demo package with deliberately messy spacing
long_description   = file: README.md
url   = https://github.com/example/confetti-demo
license    = MIT
classifiers    =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License

[options]
packages    = find:
python_requires   = >=3.9
install_requires    =
    requests>=2.28
    click==8.1.7
include_package_data    = True
zip_safe    = False

[options.entry_points]
console_scripts    =
    confetti-demo   = confetti_demo.cli:main

[flake8]
max-line-length    = 100
extend-ignore   = E203

[tool:pytest]
testpaths    = tests
addopts   = -ra --strict-markers
