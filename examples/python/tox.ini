[tox]
envlist = py312, py311, lint
isolated_build = true
skipsdist = false

[testenv]
    description = run the test suite
    deps =
    pytest>=8
    pytest-cov
    coverage[toml]
commands =
    pytest {posargs}
    coverage report

[testenv:lint]
description = static analysis
skip_install = true
deps =
    ruff
    mypy
commands =
    ruff check src
    mypy src

[flake8]
max-line-length = 100
extend-ignore =
    E203,
    W503
exclude =
    .git,
    .tox,
    dist
