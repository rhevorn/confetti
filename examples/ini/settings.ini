# Number-sign comment
[server]
host = localhost
port = 8080
enabled: true
empty_value =
data_dir =  /var/lib/confetti

[database.primary]
url =    "postgres://user:pass@localhost/app?sslmode=disable&pool=5"
pool_size =   10
timeout_seconds: 30

[  quoted-values ]
message = "keep  internal  spaces"
hash = "# this is part of the value"
expression = "left=right"
